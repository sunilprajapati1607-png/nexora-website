<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <meta name="keywords" content="{{keywords}}" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://nexoraofficial.org{{path}}" />
  <meta name="theme-color" content="#050c1a" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Nexora" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:url" content="https://nexoraofficial.org{{path}}" />
  <meta property="og:image" content="https://nexoraofficial.org/assets/img/dashboard-hero.jpg" />
  <meta property="og:locale" content="en_IN" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{title}}" />
  <meta name="twitter:description" content="{{description}}" />
  <meta name="twitter:image" content="https://nexoraofficial.org/assets/img/dashboard-hero.jpg" />
  <!-- Favicons: square and a multiple of 48 px, which is what Google needs to show
       the logo beside the search result. Keep these URLs stable. -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/img/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/img/favicon-96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png" />
  <meta name="msapplication-TileImage" content="/assets/img/favicon-192.png" />
  <meta name="msapplication-TileColor" content="#050c1a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/site.css?v={{build}}" />
  <script>
    (function () {
      var t = 'light';
      try { t = localStorage.getItem('nexora-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://nexoraofficial.org/#organization",
        "name": "Nexora",
        "alternateName": "Nexora Official",
        "url": "https://nexoraofficial.org/",
        "logo": {
          "@type": "ImageObject",
          "@id": "https://nexoraofficial.org/#logo",
          "url": "https://nexoraofficial.org/assets/img/logo-square.png",
          "contentUrl": "https://nexoraofficial.org/assets/img/logo-square.png",
          "width": 512,
          "height": 512,
          "caption": "Nexora"
        },
        "image": { "@id": "https://nexoraofficial.org/#logo" },
        "email": "info@nexoraofficial.org",
        "telephone": "+91-75671-61607",
        "address": { "@type": "PostalAddress", "addressLocality": "Ahmedabad", "addressRegion": "Gujarat", "addressCountry": "IN" },
        "founder": { "@type": "Person", "name": "Sunil Prajapati" },
        "description": "ERP, bag weight and cost forecasting software, and industrial tools for the woven sack and packaging industry.",
        "sameAs": ["https://wa.me/917567161607"]
      },
      {
        "@type": "WebSite",
        "@id": "https://nexoraofficial.org/#website",
        "url": "https://nexoraofficial.org/",
        "name": "Nexora",
        "publisher": { "@id": "https://nexoraofficial.org/#organization" },
        "inLanguage": "en-IN"
      },
      {
        "@type": "WebPage",
        "@id": "https://nexoraofficial.org{{path}}#webpage",
        "url": "https://nexoraofficial.org{{path}}",
        "name": "{{title}}",
        "description": "{{description}}",
        "isPartOf": { "@id": "https://nexoraofficial.org/#website" },
        "about": { "@id": "https://nexoraofficial.org/#organization" }
      }
    ]
  }
  </script>
</head>
<body class="{{bodyClass}}">
{{> icons}}
